name: Audit engineering baseline drift
description: 使用调用仓库自己的只读令牌审计公共 CI/CD 基线漂移

inputs:
  repository:
    description: 需要审计的 owner/repo
    required: true

runs:
  using: composite
  steps:
    - name: Audit repository baseline
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        AUDIT_REPOSITORY: ${{ inputs.repository }}
      run: |
        set -euo pipefail
        baseline_root="$(cd "${GITHUB_ACTION_PATH}/../../.." && pwd)"
        audit_runtime="$(mktemp -d "${RUNNER_TEMP}/engineering-baseline.XXXXXX")"

        cleanup() {
          rm -rf -- "${audit_runtime}"
        }
        trap cleanup EXIT

        python3 -m venv "${audit_runtime}/venv"
        "${audit_runtime}/venv/bin/python" -m pip install \
          --disable-pip-version-check \
          --no-input \
          PyYAML==6.0.3
        PATH="${audit_runtime}/venv/bin:${PATH}" \
          bash "${baseline_root}/scripts/audit-github-baseline.sh" "${AUDIT_REPOSITORY}"
