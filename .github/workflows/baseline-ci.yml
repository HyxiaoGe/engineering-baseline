name: Engineering baseline CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseline-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Baseline contract validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pinned validation tools
        run: |
          set -euo pipefail
          python3 -m venv .ci-venv
          .ci-venv/bin/python -m pip install \
            --disable-pip-version-check \
            --no-input \
            PyYAML==6.0.3 \
            markdown-it-py==3.0.0 \
            mdurl==0.1.2 \
            ruff==0.15.10

      - name: Validate source and fixtures
        run: |
          set -euo pipefail
          shellcheck scripts/*.sh tests/test-audit.sh tests/bin/gh
          .ci-venv/bin/ruff check scripts/audit_github_baseline.py
          .ci-venv/bin/ruff format --check scripts/audit_github_baseline.py
          PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/engineering-baseline-pycache" \
            .ci-venv/bin/python -m py_compile scripts/audit_github_baseline.py
          PATH="${PWD}/.ci-venv/bin:${PATH}" bash tests/test-audit.sh
