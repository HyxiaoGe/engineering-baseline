name: Master release
on:
  push: {branches: [master]}
permissions: {contents: read}
jobs:
  publish:
    name: Publish master image
    runs-on: [self-hosted, Windows, X64]
    environment: {name: dev, deployment: false}
    secrets: inherit
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      - run: docker push registry.example/project:${GITHUB_SHA}
  deploy:
    name: Deploy master image
    needs: publish
    runs-on: [self-hosted, Linux, X64]
    environment: {name: dev}
    steps:
      - run: |
          expected_image="registry.example/project:${GITHUB_SHA}"
          actual_image="$(docker inspect --format '{{.Config.Image}}' project)"
          test "${actual_image}" = "${expected_image}"
          docker exec project ./scripts/readiness-smoke.sh
