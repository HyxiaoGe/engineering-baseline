name: PR validation
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  validation:
    name: PR container validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa # v6
        with:
          persist-credentials: false
      - run: docker build --tag fixture:test .
