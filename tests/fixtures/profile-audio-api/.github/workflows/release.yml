name: Audio API release
on:
  push: {branches: [master]}
  workflow_dispatch:
    inputs:
      rollback_sha: {required: false, default: "", type: string}
      rollback_reason: {required: false, default: "", type: string}
permissions: {contents: read}
concurrency: {group: audio-api-master, cancel-in-progress: false}
env: {RELEASE_ROLLBACK: "${{ github.event.inputs.rollback_sha != '' }}"}
jobs:
  publish_audio_api:
    if: github.ref == 'refs/heads/master' && github.event.inputs.rollback_sha == ''
    runs-on: [self-hosted, Windows, X64]
    environment: {name: dev, deployment: false}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with: {username: "${{ secrets.DOCKER_USER }}", password: "${{ secrets.DOCKER_PASSWORD }}"}
      - run: docker push example/audio-api:${GITHUB_SHA}
  deploy_audio_api:
    needs: publish_audio_api
    if: ${{ always() && github.ref == 'refs/heads/master' && (needs.publish_audio_api.result == 'success' || (github.event_name == 'workflow_dispatch' && github.event.inputs.rollback_sha != '' && needs.publish_audio_api.result == 'skipped')) }}
    runs-on: [self-hosted, Linux, X64]
    environment: {name: dev}
    steps:
      - id: target_audio_api
        run: ./scripts/audio-api-target.sh
      - id: capture_audio_api
        run: ./scripts/audio-api-capture.sh
      - id: migrate_audio_api
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.rollback_sha == ''
        run: ./scripts/audio-api-migrate.sh
      - id: restart_audio_api
        run: ./scripts/audio-api-deploy.sh
      - id: health_audio_api
        run: ./scripts/audio-api-health.sh
      - id: rollback_audio_api
        if: ${{ failure() && steps.capture_audio_api.outcome == 'success' && steps.restart_audio_api.outcome != 'skipped' }}
        run: ./scripts/audio-api-rollback.sh
      - id: cleanup_audio_api
        if: ${{ success() }}
        run: docker image prune --force
  finalize_audio_api:
    needs: [publish_audio_api, deploy_audio_api]
    if: ${{ always() && github.ref == 'refs/heads/master' }}
    runs-on: [self-hosted, Linux, X64]
    environment: {name: dev, deployment: false}
    steps:
      - id: metrics_audio_api
        run: ./scripts/audio-api-metrics.sh
      - id: reject_audio_api
        if: needs.publish_audio_api.result == 'failure' || needs.deploy_audio_api.result != 'success'
        run: exit 1
