name: PR validation

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validation:
    name: PR container validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@d23441bf963a1d660f6f23aa736a7a1d5a5c2f4a # v6
      - run: docker build --tag fixture:test .
