name: Audio UI release
on:
  push: {branches: [master]}
  workflow_dispatch:
    inputs:
      rollback_sha: {required: false, default: "", type: string}
      rollback_reason: {required: false, default: "", type: string}
permissions: {contents: read}
concurrency: {group: audio-ui-release, cancel-in-progress: false}
jobs:
  publish_audio_ui:
    if: github.ref == 'refs/heads/master' && github.event.inputs.rollback_sha == ''
    runs-on: [self-hosted, Windows, X64]
    environment: {name: dev, deployment: false}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with: {username: "${{ secrets.DOCKER_USER }}", password: "${{ secrets.DOCKER_PASSWORD }}"}
      - run: docker push example/audio-ui:${GITHUB_SHA}
  deploy_audio_ui:
    needs: publish_audio_ui
    if: ${{ always() && github.ref == 'refs/heads/master' && (needs.publish_audio_ui.result == 'success' || (github.event_name == 'workflow_dispatch' && github.event.inputs.rollback_sha != '' && needs.publish_audio_ui.result == 'skipped')) }}
    runs-on: [self-hosted, Linux, X64]
    environment: {name: dev}
    steps:
      - id: target_audio_ui
        run: ./scripts/audio-ui-target.sh
      - id: capture_audio_ui
        run: ./scripts/audio-ui-capture.sh
      - id: restart_audio_ui
        run: ./scripts/audio-ui-deploy.sh
      - id: health_audio_ui
        run: ./scripts/audio-ui-health.sh
      - id: rollback_audio_ui
        continue-on-error: ${{ false }}
        if: ${{ failure() && steps.capture_audio_ui.outcome == 'success' && steps.restart_audio_ui.outcome != 'skipped' }}
        run: ./scripts/audio-ui-rollback.sh
      - id: cleanup_audio_ui
        if: ${{ success() }}
        run: docker image prune --force
  finalize_audio_ui:
    needs: [publish_audio_ui, deploy_audio_ui]
    if: ${{ always() && github.ref == 'refs/heads/master' }}
    runs-on: [self-hosted, Linux, X64]
    environment: {name: dev, deployment: false}
    steps:
      - id: metrics_audio_ui
        run: ./scripts/audio-ui-metrics.sh
      - id: reject_audio_ui
        if: needs.publish_audio_ui.result == 'failure' || needs.deploy_audio_ui.result != 'success'
        run: exit 1
