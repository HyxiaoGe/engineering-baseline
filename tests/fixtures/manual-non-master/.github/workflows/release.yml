name: Master release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish master image
    # refs/heads/master：注释不能充当 workflow_dispatch 防护。
    runs-on: [self-hosted, Windows, X64]
    environment:
      name: dev
      deployment: false
    steps:
      - uses: actions/checkout@d23441bf963a1d660f6f23aa736a7a1d5a5c2f4a # v6
      - uses: docker/login-action@dbcb8133bf8b11f670a9e4e00b0cd1f27af4cfec # v4.6.0
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - run: docker push registry.example/project:${GITHUB_SHA}
  deploy:
    name: Deploy master image
    needs: publish
    runs-on: [self-hosted, Linux, X64]
    environment:
      name: dev
    steps:
      - uses: actions/checkout@d23441bf963a1d660f6f23aa736a7a1d5a5c2f4a # v6
      - run: |
          actual_image="$(docker inspect --format '{{.Config.Image}}' project)"
          test "${actual_image}" = "registry.example/project:${GITHUB_SHA}"
          docker exec project ./scripts/readiness-smoke.sh
      - run: |
          curl --header "Authorization: Basic ${{ secrets.PUSHGW_BASIC_AUTH }}" https://metrics.example
