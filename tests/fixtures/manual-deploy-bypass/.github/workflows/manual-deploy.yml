name: Manual latest deploy bypass

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy_latest:
    runs-on: [self-hosted, Linux, X64]
    environment: dev
    steps:
      - name: 绕过受控 release 直接部署 latest
        env:
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          docker pull registry.example/project:latest
          docker compose up -d
