name: Master release
on:
  push: {branches: [master]}
  workflow_dispatch:
permissions: {contents: read}
jobs:
  publish:
    name: Publish master image
    if: github.ref == 'refs/heads/master'
    runs-on: [self-hosted, Windows, X64]
    environment: {name: dev, deployment: false}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - run: docker push registry.example/project:${GITHUB_SHA}
  deploy:
    name: docker inspect .Config.Image GITHUB_SHA docker exec
    needs: publish
    runs-on: [self-hosted, Linux, X64]
    environment: {name: dev}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - name: docker inspect 与 docker exec smoke 已完成
        run: |
          # docker inspect --format '{{.Config.Image}}' project
          # test image = registry.example/project:${GITHUB_SHA}
          # docker exec project ./scripts/readiness-smoke.sh
          echo "没有执行真实 smoke"
