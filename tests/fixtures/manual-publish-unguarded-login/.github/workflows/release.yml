name: Master release
on:
  push: {branches: [master]}
  workflow_dispatch:
permissions: {contents: read}
jobs:
  publish:
    name: Publish master image
    runs-on: [self-hosted, Windows, X64]
    environment: {name: dev, deployment: false}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - run: ./scripts/ci-publish-image.ps1
  deploy:
    name: Deploy master image
    if: github.ref == 'refs/heads/master'
    needs: publish
    runs-on: [self-hosted, Linux, X64]
    environment: {name: dev}
    steps:
      - run: |
          expected_image="registry.example/project:${GITHUB_SHA}"
          actual_image="$(docker inspect --format '{{.Config.Image}}' project)"
          test "${actual_image}" = "${expected_image}"
          docker exec project ./scripts/readiness-smoke.sh
